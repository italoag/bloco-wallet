name: Container

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  preflight:
    name: Test Candidate Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: bloco-wallet:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test final image
        run: docker run --rm bloco-wallet:candidate release-smoke
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bloco-wallet:candidate
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  build:
    name: Build Docker Image
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bloco-wallet
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Get version info
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(git describe --tags --always --dirty)" >> $GITHUB_OUTPUT
          fi
          echo "GIT_REV=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            GIT_REV=${{ steps.version.outputs.GIT_REV }}
            BUILD_DATE=${{ steps.version.outputs.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bloco-wallet:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Test Docker image
        run: |
          # Test that the image runs correctly
          docker run --rm ${{ env.REGISTRY }}/${{ github.repository_owner }}/bloco-wallet:${{ steps.meta.outputs.version }} release-smoke

  multi-arch-test:
    name: Multi-Architecture Test
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bloco-wallet

      - name: Test image on ${{ matrix.platform }}
        run: |
          # Test the specific platform image
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/bloco-wallet:${{ steps.meta.outputs.version }} \
            release-smoke

  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [build, multi-arch-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete old images
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = 'blocowallet';
            
            try {
              // Get all versions of the package
              const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                username: owner,
                package_type: 'container',
                package_name: packageName,
                per_page: 100
              });
            
              // Keep the 10 most recent versions and delete the rest
              const versionsToDelete = versions.data
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                .slice(10);
            
              for (const version of versionsToDelete) {
                // Skip tagged versions (releases)
                if (version.metadata && version.metadata.container && version.metadata.container.tags.length > 0) {
                  const hasReleaseTag = version.metadata.container.tags.some(tag => 
                    tag.match(/^v?\d+\.\d+\.\d+/) || tag === 'latest'
                  );
                  if (hasReleaseTag) {
                    console.log(`Skipping version ${version.id} with release tags: ${version.metadata.container.tags.join(', ')}`);
                    continue;
                  }
                }
            
                try {
                  await github.rest.packages.deletePackageVersionForUser({
                    username: owner,
                    package_type: 'container',
                    package_name: packageName,
                    package_version_id: version.id
                  });
                  console.log(`Deleted version ${version.id}`);
                } catch (error) {
                  console.log(`Failed to delete version ${version.id}: ${error.message}`);
                }
              }
            } catch (error) {
              console.log(`Error managing package versions: ${error.message}`);
            }