name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

env:
  GO_VERSION: '1.26.7'

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve immutable release commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        name: Validate tag and resolve commit
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            TAG=$DISPATCH_TAG
          else
            TAG=$REF_NAME
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo 'Invalid release tag' >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null
          SHA=$(git rev-list -n 1 "$TAG")
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo 'Release tag is not reachable from main' >&2
            exit 1
          fi
          printf 'tag=%s\nsha=%s\n' "$TAG" "$SHA" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release commit
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify modules and tests
        run: |
          go mod verify
          go test ./... -race -count=1 -tags=production -timeout=25m
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ''
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            extension: ''
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: ''
          - runner: macos-14
            goos: darwin
            goarch: arm64
            extension: ''
          - runner: windows-latest
            goos: windows
            goarch: amd64
            extension: '.exe'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build native artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p dist
          OUTPUT="dist/blocowallet-${VERSION}-${GOOS}-${GOARCH}${{ matrix.extension }}"
          go build -trimpath -tags=netgo,nocgo \
            -ldflags="-w -s -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$OUTPUT" ./cmd/blocowallet
          "$OUTPUT" --version
          "$OUTPUT" release-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and draft release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          cd dist
          sha256sum blocowallet-* > checksums.txt
          cd ..
          make sbom VERSION="$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/blocowallet-*
            dist/checksums.txt
            dist/sbom.json
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          ACTUAL_SHA=$(git rev-list -n 1 "$TAG")
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo 'Release tag moved after verification' >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --verify-tag --draft --generate-notes \
            --title "Release $TAG"
