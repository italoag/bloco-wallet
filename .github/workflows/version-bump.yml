name: Bump Version

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get last tag
        id: last
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next
        run: |
          # Reruns: HEAD is already tagged from a previous attempt. Reuse that
          # tag so we neither fail on `git tag` nor bump the version twice.
          existing=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -n "$existing" ]; then
            echo "HEAD is already tagged as $existing; reusing it"
            echo "version=$existing" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=${{ steps.last.outputs.tag }}
          version=${last#v}
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Warning: Tag '$last' does not follow semantic versioning. Defaulting to v0.1.0."
            major=0
            minor=0
            patch=0
          fi
          src_branch=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")
          echo "Source branch: $src_branch"
          if [[ "$src_branch" =~ ^(hotfix|bugfix)/ ]]; then
            # hotfix/* or bugfix/* => patch bump
            patch=$((patch+1))
          else
            # feature/* and others (default) => minor bump
            minor=$((minor+1))
            patch=0
          fi
          echo "version=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.next.outputs.create == 'true'
        env:
          NEW_TAG: ${{ steps.next.outputs.version }}
        run: |
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Dispatch release workflow
        # Tags pushed with GITHUB_TOKEN never trigger `on: push: tags`, so the
        # Release workflow must be started explicitly via workflow_dispatch.
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.next.outputs.version }}
        run: gh workflow run release.yml --ref main -f tag="$NEW_TAG"
